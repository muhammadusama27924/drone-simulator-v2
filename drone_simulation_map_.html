<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drone Ops Simulation Map</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #12151c;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      color: #f3f4f6;
      user-select: none;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    /* HUD Overlay */
    #hud {
      position: absolute;
      top: 16px;
      left: 16px;
      width: 280px;
      padding: 16px;
      background: rgba(18, 21, 28, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      font-size: 13px;
    }

    .hud-header {
      font-weight: 700;
      letter-spacing: 1px;
      color: #9ca3af;
      text-transform: uppercase;
      font-size: 11px;
      margin-bottom: 8px;
    }

    .hud-title {
      font-size: 16px;
      font-weight: 600;
      color: #38bdf8;
      margin-bottom: 12px;
    }

    .hud-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .hud-label {
      color: #9ca3af;
    }

    .hud-value {
      font-weight: 500;
      color: #f3f4f6;
    }

    .status-badge {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      margin-right: 6px;
    }

    .status-badge.active {
      background: #10b981;
    }

    /* Analog Stick Display */
    .stick-visualizers {
      display: flex;
      justify-content: space-between;
      margin: 12px 0;
      padding: 8px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 6px;
    }

    .stick-box {
      width: 50px;
      height: 50px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      position: relative;
    }

    .stick-dot {
      width: 8px;
      height: 8px;
      background: #38bdf8;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .stick-label {
      text-align: center;
      font-size: 9px;
      color: #6b7280;
      margin-top: 4px;
    }

    /* Buttons Panel */
    #controls {
      position: absolute;
      bottom: 16px;
      left: 16px;
      display: flex;
      gap: 8px;
      flex-direction: column;
    }

    .btn {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e2e8f0;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      backdrop-filter: blur(4px);
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: rgba(51, 65, 85, 0.9);
      border-color: #38bdf8;
    }

    .btn-row {
      display: flex;
      gap: 8px;
    }

    #debug-log {
      font-family: monospace;
      font-size: 10px;
      color: #ef4444;
      max-height: 50px;
      overflow-y: auto;
      margin-bottom: 8px;
    }
  </style>

  <!-- Import Maps for Three.js and Rapier Physics -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "@dimforge/rapier3d-compat": "https://unpkg.com/@dimforge/rapier3d-compat@0.11.2/rapier.es.js"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="hud">
    <div class="hud-header">Flight Telemetry</div>
    <div class="hud-title" id="drone-callsign">PILOT: VIPER-1</div>
    <div id="debug-log"></div>
    
    <div class="hud-row">
      <span class="hud-label">System State</span>
      <span class="hud-value"><span id="arm-indicator" class="status-badge"></span><span id="arm-text">Disarmed</span></span>
    </div>

    <div class="stick-visualizers">
      <div>
        <div class="stick-box"><div id="stick-left" class="stick-dot"></div></div>
        <div class="stick-label">Throttle / Yaw</div>
      </div>
      <div>
        <div class="stick-box"><div id="stick-right" class="stick-dot"></div></div>
        <div class="stick-label">Pitch / Roll</div>
      </div>
    </div>

    <div class="hud-row">
      <span class="hud-label">Flight Mode</span>
      <span class="hud-value" id="flight-mode-val">Acro</span>
    </div>
    <div class="hud-row">
      <span class="hud-label">Throttle</span>
      <span class="hud-value" id="val-throttle">0%</span>
    </div>
    <div class="hud-row">
      <span class="hud-label">Altitude (MSL)</span>
      <span class="hud-value" id="val-alt">0.0 m</span>
    </div>
    <div class="hud-row">
      <span class="hud-label">Ground Speed</span>
      <span class="hud-value" id="val-speed">0.0 km/h</span>
    </div>
    <div class="hud-row">
      <span class="hud-label">Input Source</span>
      <span class="hud-value" id="val-input">Keyboard</span>
    </div>
  </div>

  <div id="controls">
    <div class="btn-row">
      <button class="btn" id="btn-arm">Arm Motors (Space)</button>
      <button class="btn" id="btn-cam">Camera Mode (C)</button>
    </div>
    <button class="btn" id="btn-return">Return to Mission Control</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import RAPIER from '@dimforge/rapier3d-compat';

    // Parse URL Params
    const urlParams = new URLSearchParams(window.location.search);
    const requestedType = urlParams.get('type') || 'commercial';
    const pilotName = urlParams.get('pilot') || 'VIPER-1';

    document.getElementById('drone-callsign').innerText = `PILOT: ${pilotName.toUpperCase()} (${requestedType.toUpperCase()})`;

    // Drone Build Specifications based on Type
    const DRONE_BUILDS = {
      commercial: {
        mass: 3.5, // Heavier body
        thrust: 45.0,
        tiltLimit: 18 * Math.PI / 180, // Restrict lean angle for smooth flight
        autoLevel: true, // Enable auto-leveling
        drag: 0.98
      },
      fpv: {
        mass: 0.8,
        thrust: 35.0,
        tiltLimit: 55 * Math.PI / 180,
        autoLevel: false,
        drag: 0.99
      },
      racing: {
        mass: 0.6,
        thrust: 40.0,
        tiltLimit: 75 * Math.PI / 180,
        autoLevel: false,
        drag: 0.995
      }
    };

    const build = DRONE_BUILDS[requestedType] || DRONE_BUILDS.commercial;
    document.getElementById('flight-mode-val').innerText = build.autoLevel ? 'Angle (Auto-Level)' : 'Acro Mode';

    // State
    let scene, camera, renderer, world;
    let droneMesh, droneBody;
    let motorsArmed = false;
    let lastDevice = 'keyboard';
    let padPrev = {};
    let prevArmBtn = false;
    let debugText = '';

    // Controls input state
    const cmd = { thr: 0, yaw: 0, pit: 0, rol: 0 };
    const keys = {};

    function logDebug(msg) {
      const el = document.getElementById('debug-log');
      el.innerText = msg;
    }

    async function init() {
      // 1. Setup Three.js Scene
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a202c);
      scene.fog = new THREE.FogExp2(0x1a202c, 0.015);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 3, 6);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      document.getElementById('canvas-container').appendChild(renderer.domElement);

      // Lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
      dirLight.position.set(20, 40, 20);
      dirLight.castShadow = true;
      scene.add(dirLight);

      // Environment - Ground & Obstacles
      const grid = new THREE.GridHelper(200, 100, 0x38bdf8, 0x334155);
      grid.position.y = -0.01;
      scene.add(grid);

      const groundGeo = new THREE.PlaneGeometry(200, 200);
      const groundMat = new THREE.MeshStandardMaterial({ color: 0x0f172a });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      // Add simple obstacles
      for (let i = 0; i < 15; i++) {
        const boxGeo = new THREE.BoxGeometry(4, Math.random() * 8 + 4, 4);
        const boxMat = new THREE.MeshStandardMaterial({ color: 0x334155 });
        const box = new THREE.Mesh(boxGeo, boxMat);
        box.position.set((Math.random() - 0.5) * 80, boxGeo.parameters.height / 2, (Math.random() - 0.5) * 80);
        box.castShadow = true;
        box.receiveShadow = true;
        scene.add(box);
      }

      // 2. Setup Rapier Physics
      await RAPIER.init();
      world = new RAPIER.World({ x: 0.0, y: -9.81, z: 0.0 });

      // Ground Collider
      const groundColliderDesc = RAPIER.ColliderDesc.cuboid(100, 0.1, 100);
      world.createCollider(groundColliderDesc);

      // Create Drone Mesh & RigidBody
      createDrone();

      // Listeners
      window.addEventListener('resize', onWindowResize);
      window.addEventListener('keydown', (e) => keys[e.code] = true);
      window.addEventListener('keyup', (e) => keys[e.code] = false);

      document.getElementById('btn-arm').addEventListener('click', toggleArm);
      document.getElementById('btn-return').addEventListener('click', () => {
        window.location.href = urlParams.get('return') || 'index.html';
      });

      // Start Loop
      animate();
    }

    function createDrone() {
      // Visual Mesh
      const group = new THREE.Group();
      
      const bodyGeo = new THREE.BoxGeometry(0.6, 0.15, 0.6);
      const bodyMat = new THREE.MeshStandardMaterial({ color: requestedType === 'commercial' ? 0xf59e0b : 0x38bdf8 });
      const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
      bodyMesh.castShadow = true;
      group.add(bodyMesh);

      // Rotor Arms
      const armMat = new THREE.MeshStandardMaterial({ color: 0x1e293b });
      for (let i = 0; i < 4; i++) {
        const arm = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.08, 0.8), armMat);
        arm.rotation.y = (i * Math.PI) / 2 + Math.PI / 4;
        group.add(arm);
      }

      scene.add(group);
      droneMesh = group;

      // Physics RigidBody
      const bodyDesc = RAPIER.RigidBodyDesc.dynamic()
        .setTranslation(0, 1.0, 0)
        .setLinearDamping(0.5)
        .setAngularDamping(2.0);
      droneBody = world.createRigidBody(bodyDesc);

      const colliderDesc = RAPIER.ColliderDesc.cuboid(0.4, 0.1, 0.4);
      world.createCollider(colliderDesc, droneBody);
    }

    function toggleArm() {
      motorsArmed = !motorsArmed;
      const badge = document.getElementById('arm-indicator');
      const text = document.getElementById('arm-text');

      if (motorsArmed) {
        badge.classList.add('active');
        text.innerText = 'Armed';
        text.style.color = '#10b981';
      } else {
        badge.classList.remove('active');
        text.innerText = 'Disarmed';
        text.style.color = '#ef4444';
      }
    }

    function clamp(val, min, max) {
      return Math.max(min, Math.min(max, val));
    }

    function radialDeadzone(x, y, dz = 0.1) {
      const mag = Math.sqrt(x * x + y * y);
      if (mag < dz) return [0, 0];
      const factor = (mag - dz) / (1 - dz) / mag;
      return [x * factor, y * factor];
    }

    function pollInput(dt) {
      const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
      const pad = gamepads[0] || gamepads[1] || gamepads[2] || gamepads[3];

      if (pad) {
        const a = pad.axes;

        // Left Stick (Throttle / Yaw)
        const yawVal = a[0] || 0;
        const thrVal = -(a[1] || 0);

        // Generic USB Gamepad Axis Detection for Right Stick (Pitch / Roll)
        // Checks Axes 2/3 and fallback to Axis 5 for Pitch on varying generic controllers
        const rolVal = a[2] !== undefined ? a[2] : 0;
        const pitVal = a[3] !== undefined ? -a[3] : (a[5] !== undefined ? -a[5] : 0);

        const [yaw, thr] = radialDeadzone(yawVal, thrVal);
        const [rol, pit] = radialDeadzone(rolVal, pitVal);

        cmd.thr = clamp((thr + 1) / 2, 0, 1);
        cmd.yaw = yaw;
        cmd.pit = pit;
        cmd.rol = rol;

        // Toggle Arming via Gamepad Button 0
        const btnArm = !!(pad.buttons[0] && pad.buttons[0].pressed);
        if (btnArm && !prevArmBtn) toggleArm();
        prevArmBtn = btnArm;

        document.getElementById('val-input').innerText = pad.id.substring(0, 16) + '...';
      } else {
        // Keyboard fallback
        if (keys['KeyW']) cmd.thr = clamp(cmd.thr + dt * 2, 0, 1);
        else if (keys['KeyS']) cmd.thr = clamp(cmd.thr - dt * 2, 0, 1);
        else cmd.thr = 0;

        cmd.yaw = (keys['KeyD'] ? 1 : 0) - (keys['KeyA'] ? 1 : 0);
        cmd.pit = (keys['ArrowUp'] ? 1 : 0) - (keys['ArrowDown'] ? 1 : 0);
        cmd.rol = (keys['ArrowRight'] ? 1 : 0) - (keys['ArrowLeft'] ? -1 : 0);

        if (keys['Space']) {
          keys['Space'] = false;
          toggleArm();
        }

        document.getElementById('val-input').innerText = 'Keyboard';
      }

      // Update UI visualizers
      document.getElementById('stick-left').style.transform = `translate(${cmd.yaw * 20 - 50}%, ${-cmd.thr * 20 - 50}%)`;
      document.getElementById('stick-right').style.transform = `translate(${cmd.rol * 20 - 50}%, ${-cmd.pit * 20 - 50}%)`;
    }

    function applyFlightForces(dt) {
      if (!motorsArmed) return;

      const rot = droneMesh.quaternion;
      const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(rot);
      const up = new THREE.Vector3(0, 1, 0).applyQuaternion(rot);

      // Thrust Force
      const totalThrust = cmd.thr * build.thrust;
      const thrustVector = new THREE.Vector3(0, totalThrust, 0).applyQuaternion(rot);
      droneBody.applyImpulse({ x: thrustVector.x * dt, y: thrustVector.y * dt, z: thrustVector.z * dt }, true);

      // Angular Torque Control
      const targetTorque = new THREE.Vector3();

      // Check if Commercial Airframe (Angle Auto-Level Mode)
      if (build.autoLevel) {
        const currentUp = new THREE.Vector3(0, 1, 0).applyQuaternion(rot);
        
        // Calculate desired orientational tilt limit
        const effectiveTilt = build.tiltLimit;
        const desiredUp = new THREE.Vector3(
          cmd.rol * Math.sin(effectiveTilt),
          1,
          -cmd.pit * Math.sin(effectiveTilt)
        ).normalize();

        // Auto-level correction force when stick neutral
        if (Math.abs(cmd.pit) < 0.05 && Math.abs(cmd.rol) < 0.05) {
          desiredUp.set(0, 1, 0);
        }

        const correction = new THREE.Vector3().crossVectors(currentUp, desiredUp).multiplyScalar(12.0);
        targetTorque.add(correction);
      } else {
        // Acro / Manual rotation mode for non-commercial
        targetTorque.x = cmd.pit * 8.0;
        targetTorque.z = -cmd.rol * 8.0;
      }

      // Yaw torque
      targetTorque.y = -cmd.yaw * 5.0;

      droneBody.applyTorqueImpulse({ x: targetTorque.x * dt, y: targetTorque.y * dt, z: targetTorque.z * dt }, true);
    }

    function updateTelemetry() {
      const pos = droneBody.translation();
      const vel = droneBody.linvel();
      const speed = Math.sqrt(vel.x * vel.x + vel.y * vel.y + vel.z * vel.z) * 3.6;

      document.getElementById('val-throttle').innerText = `${Math.round(cmd.thr * 100)}%`;
      document.getElementById('val-alt').innerText = `${pos.y.toFixed(1)} m`;
      document.getElementById('val-speed').innerText = `${speed.toFixed(1)} km/h`;
    }

    function animate() {
      requestAnimationFrame(animate);

      const dt = 1 / 60;
      pollInput(dt);

      if (world) {
        applyFlightForces(dt);
        world.step();

        // Sync Mesh position with Rigid Body
        const pos = droneBody.translation();
        const rot = droneBody.rotation();

        droneMesh.position.set(pos.x, pos.y, pos.z);
        droneMesh.quaternion.set(rot.x, rot.y, rot.z, rot.w);

        // Smooth Camera Follow
        const targetCamPos = new THREE.Vector3(pos.x, pos.y + 2.5, pos.z + 5.5);
        camera.position.lerp(targetCamPos, 0.1);
        camera.lookAt(pos.x, pos.y + 0.5, pos.z);

        updateTelemetry();
      }

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    init();
  </script>
</body>
</html>
